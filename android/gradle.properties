org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
android.enableJetifier=true
org.gradle.workers.max=2
kotlin.daemon.jvm.options=-Xmx1G
# Proyek ada di drive D:, sedangkan pub-cache plugin (mis. camera_android_camerax)
# ada di drive C: — kompilasi incremental Kotlin gagal menghitung relative path
# lintas drive di Windows ("this and base files have different roots").
kotlin.incremental=false
