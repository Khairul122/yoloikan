org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
android.enableJetifier=true
org.gradle.workers.max=2
kotlin.daemon.jvm.options=-Xmx1G
# Proyek ada di drive D:, sedangkan pub-cache plugin (kode Kotlin native
# seperti package_info_plus, ultralytics_yolo) ada di drive C: — kompilasi
# incremental Kotlin gagal menghitung relative path lintas drive di Windows
# ("this and base files have different roots").
kotlin.incremental=false
